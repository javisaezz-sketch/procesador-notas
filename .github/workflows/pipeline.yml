name: Pipeline emails (cada 10 min)

on:
  schedule:
    # Cada 10 minutos (UTC). GitHub puede retrasarlo 1-5 min.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: pipeline-emails
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Comprobar versión Node
        run: node -v

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar secrets
        run: node scripts/verificar-secrets.cjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

      - name: Ejecutar pipeline POP3 + Gemini
        id: pipeline
        run: node pipeline.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          DASHBOARD_URL: https://procesador-notas.vercel.app

      - name: Resumen si falla
        if: failure()
        run: |
          echo "## Pipeline fallido" >> "$GITHUB_STEP_SUMMARY"
          echo "Revisa los logs del job. Puede haber fallado un buzón POP3 o Gemini en una nota concreta." >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Pipeline fallido::Revisa los logs en Actions. Algunos medios pueden haber fallado sin bloquear el resto."
