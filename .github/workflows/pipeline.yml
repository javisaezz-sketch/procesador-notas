name: Pipeline emails (cada 10 min)

on:
  schedule:
    # Cada 10 minutos (UTC). GitHub puede retrasarlo 1-5 min.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: pipeline-emails
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Comprobar versión Node
        run: node -v

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar secrets
        run: node scripts/verificar-secrets.cjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

      - name: Ejecutar pipeline POP3 + Gemini
        id: pipeline
        run: node pipeline.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          DASHBOARD_URL: https://procesador-notas.vercel.app

      - name: Resumen del pipeline
        if: always()
        run: |
          if [ -f pipeline-summary.json ]; then
            node <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('pipeline-summary.json', 'utf8'));
          const lines = [];

          if (summary.ok && !summary.advertencias?.length) {
            lines.push('## Pipeline OK');
            lines.push(`Emails nuevos: ${summary.emails?.nuevas ?? 0}`);
            lines.push(`Artículos generados: ${summary.articulosGenerados ?? 0}`);
          } else if (summary.ok && summary.advertencias?.length) {
            lines.push('## Pipeline completado con avisos');
            lines.push(`Emails nuevos: ${summary.emails?.nuevas ?? 0}`);
            lines.push(`Artículos generados: ${summary.articulosGenerados ?? 0}`);
            lines.push('');
            lines.push('### Avisos');
            for (const item of summary.advertencias) {
              if (item.medio) lines.push(`- POP3 **${item.medio}**: ${item.error}`);
              else if (item.notaId) lines.push(`- Gemini nota **#${item.notaId}**: ${item.error}`);
              else lines.push(`- ${item.error}`);
            }
          } else {
            lines.push('## Pipeline fallido');
            if (summary.fatal) {
              lines.push(`**${summary.fatal.fase}**: ${summary.fatal.error}`);
            }
            if (summary.advertencias?.length) {
              lines.push('');
              lines.push('### Avisos previos');
              for (const item of summary.advertencias) {
                if (item.medio) lines.push(`- POP3 **${item.medio}**: ${item.error}`);
                else if (item.notaId) lines.push(`- Gemini nota **#${item.notaId}**: ${item.error}`);
              }
            }
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
          else
            echo "## Pipeline fallido" >> "$GITHUB_STEP_SUMMARY"
            echo "No se generó resumen. Revisa los logs del paso anterior." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f pipeline-summary.json ]; then
            node <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('pipeline-summary.json', 'utf8'));
          if (!summary.ok && summary.fatal) {
            console.log(`::error title=Pipeline fallido::${summary.fatal.fase}: ${summary.fatal.error}`);
          } else if (summary.advertencias?.length) {
            for (const item of summary.advertencias.slice(0, 5)) {
              const msg = item.medio
                ? `POP3 ${item.medio}: ${item.error}`
                : item.notaId
                  ? `Gemini nota #${item.notaId}: ${item.error}`
                  : item.error;
              console.log(`::warning title=Aviso del pipeline::${msg}`);
            }
          }
          NODE
          fi
