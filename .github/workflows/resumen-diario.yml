name: Resumen diario de correos

on:
  schedule:
    # 18:05 UTC = 20:05 en horario de verano; 19:05 UTC = 20:05 en invierno.
    # El script solo envía cuando en Madrid son las 20.
    - cron: '5 18,19 * * *'
  workflow_dispatch:

concurrency:
  group: resumen-diario
  cancel-in-progress: false

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Enviar resumen del día
        run: node scripts/resumen-diario.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESUMEN_FORZAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
